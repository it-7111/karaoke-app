<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カラオケ帳</title>
<meta name="description" content="歌える曲と点数をオフラインで記録し、スプレッドシートと同期する">
<meta name="theme-color" content="#d9466f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="カラオケ帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
<header class="topbar">
  <button class="icon-btn back" id="backBtn" hidden aria-label="戻る">‹</button>
  <h1 id="title">曲</h1>
  <button class="sync-chip" id="syncChip" data-action="sync">未設定</button>
</header>
<main id="main"></main>
<nav class="tabbar" id="tabbar">
  <button data-tab="songs" class="active"><span class="ti">♪</span>曲</button>
  <button data-tab="setlist"><span class="ti">☰</span>セトリ</button>
  <button data-tab="log"><span class="ti">✎</span>記録</button>
  <button data-tab="stats"><span class="ti">▥</span>統計</button>
  <button data-tab="settings"><span class="ti">⚙</span>設定</button>
</nav>
<button class="fab" id="fab" data-action="new-score" aria-label="点数を記録">＋</button>
<div class="sheet-backdrop" id="modal" hidden></div>
<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <button data-action="close-viewer">閉じる</button>
    <span id="viewerTitle"></span>
    <span class="viewer-tools">
      <button data-action="zoom" data-z="-1">−</button>
      <button data-action="zoom" data-z="1">＋</button>
      <button data-action="edit-text" id="viewerEdit" hidden>編集</button>
      <button data-action="share-pdf">共有</button>
    </span>
  </div>
  <div class="viewer-pages" id="viewerPages"></div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js?v=10"></script>
</body>
</html>
